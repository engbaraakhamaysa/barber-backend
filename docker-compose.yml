services:
  db:
    image: postgres:15
    container_name: barber_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - pgdata_data:/var/lib/postgresql/data

volumes:
  pgdata_data:
